[project]
name = "meal-planner"
version = "0.3.1"
description = "Save recipes from social media links, plan the week, copy a grocery list."
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.2",
    "anthropic>=2.0",
    "yt-dlp>=2024.10.7",
    "httpx2>=2.0",  # also used by the anthropic SDK; one HTTP library on the Pi
]

[project.optional-dependencies]
dev = [
    "pytest>=8", "pytest-cov>=6", "ruff>=0.6", "mypy>=1.13", "httpx>=0.27", "uv>=0.13",
    # The build backend, so requirements-dev.txt locks it too: CI and dev setup
    # install the app with --no-build-isolation instead of fetching it unpinned.
    "setuptools>=77",
]

[build-system]
requires = ["setuptools>=77"]  # 77+: SPDX license field
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Unclosed files/connections fail the run instead of scrolling past as warnings.
filterwarnings = [
    "error::ResourceWarning",
    "error::pytest.PytestUnraisableExceptionWarning",
]

[tool.coverage.run]
source = ["app"]

[tool.coverage.report]
# Currently ~98%. Raise this as coverage grows; don't lower it to make a PR pass.
fail_under = 95
show_missing = true
skip_covered = true

[tool.mypy]
python_version = "3.11"
files = ["app"]
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = ["yt_dlp", "yt_dlp.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S"]

[tool.ruff.lint.per-file-ignores]
# Tests may assert, use fake passwords, and run bash on the deploy scripts.
"tests/**" = ["S101", "S105", "S106", "S603", "S607"]
