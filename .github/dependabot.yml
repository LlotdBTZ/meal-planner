# Dependency bumps arrive as their own PRs (see CLAUDE.md).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: ["type: chore"]
    commit-message:
      prefix: ci
    # Wait a week before proposing a new release, so a compromised or broken
    # one is usually caught and yanked first. Security updates aren't delayed.
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    labels: ["type: chore"]
    commit-message:
      prefix: chore
    cooldown:
      default-days: 7 # see above
    # Bumps the locked versions in requirements.txt (pyproject.toml minimums stay
    # unless a bump needs more). CI checks the lock still matches pyproject.toml.
    versioning-strategy: increase-if-necessary
    ignore:
      # Auto-updates weekly on the Pi instead (deploy/meal-planner-ytdlp-update.timer).
      - dependency-name: yt-dlp
