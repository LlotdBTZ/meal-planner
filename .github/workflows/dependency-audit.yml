name: Dependency audit

# Checks the locked deps (runtime, as the Pi installs them, plus the dev tools)
# for known vulnerabilities.
# The weekly run catches advisories published against versions we haven't changed.
# yt-dlp isn't in the lock file (it auto-updates on the Pi), so it isn't audited.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "29 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pip-audit:
    name: pip-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11" # matches the Pi
      - uses: pypa/gh-action-pip-audit@1220774d901786e6f652ae159f7b6bc8fea6d266 # v1.1.0
        with:
          inputs: requirements.txt requirements-dev.txt
          # Every package is pinned with hashes, so audit the list as-is
          # without resolving or installing anything.
          require-hashes: true
          disable-pip: true
