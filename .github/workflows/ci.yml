name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Third-party actions are pinned to full commit SHAs (Dependabot keeps them current).
jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 3.11 = Raspberry Pi OS Bookworm; latest to catch upcoming breakage
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      # Hash-locked runtime + dev tools (runtime versions identical to the Pi's
      # requirements.txt), then the app itself with the locked setuptools: no
      # resolving and no unpinned build-time downloads.
      - run: pip install --require-hashes -r requirements-dev.txt
      - run: pip install --no-deps --no-build-isolation -e .
      # The one unlocked dependency, on purpose: the Pi auto-updates yt-dlp
      # weekly, so test against the latest release too (see CLAUDE.md).
      - run: pip install yt-dlp
      - name: Lock files match pyproject.toml
        if: matrix.python-version == '3.11'
        run: |
          scripts/lock-deps.sh
          git diff --exit-code requirements.txt requirements-dev.txt \
            || { echo "::error::Lock files are out of date: run scripts/lock-deps.sh"; exit 1; }
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest -q --cov --cov-report=term

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: shellcheck --version && shellcheck deploy/*.sh scripts/*.sh

  terraform:
    name: terraform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      - run: terraform -chdir=infra/github fmt -check -recursive
      - run: terraform -chdir=infra/github init -backend=false
      - run: terraform -chdir=infra/github validate
