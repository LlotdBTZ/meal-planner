name: Bug report
description: Something doesn't work as described.
labels: ["type: bug"]
body:
  - type: markdown
    attributes:
      value: |
        This repo is public. **Don't paste API keys, passwords, cookies, `.env` contents, or private links.**
        Security problems: use private reporting instead (see SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Share a TikTok link…\n2. …"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The release tag running on the Pi (`readlink /opt/meal-planner/current`).
      placeholder: v0.2.0
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: "`journalctl -u meal-planner -n 50` (check for secrets first)."
      render: text
